name: StikSound Android

on:
  push:
    branches: [main]
    paths:
      - "stiksound-android/**"
      - ".github/workflows/stiksound-android.yml"
  pull_request:
    paths:
      - "stiksound-android/**"
      - ".github/workflows/stiksound-android.yml"
  workflow_dispatch:

concurrency:
  group: stiksound-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stiksound-android

jobs:
  build:
    name: Unit tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and app unit tests, screenshots, lint, debug and test APKs
        run: >
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: stiksound-apks
          path: |
            stiksound-android/app/build/outputs/apk/debug/app-debug.apk
            stiksound-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stiksound-reports
          path: |
            stiksound-android/app/build/screenshots/
            stiksound-android/app/build/reports/
            stiksound-android/core/build/reports/

  instrumented:
    name: Codec tests on emulator (API ${{ matrix.api-level }})
    # Reuses the APKs from the build job, so this job needs no Gradle and downloads no dependencies.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: stiksound-apks
          path: stiksound-android/build/apks
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run MediaCodec, MediaMuxer and WebP tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: stiksound-android
          script: sh scripts/run-instrumented-tests.sh build/apks/debug/app-debug.apk build/apks/androidTest/debug/app-debug-androidTest.apk build/instrumented-tests.log
      - name: Upload instrumented test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stiksound-android-instrumented-api${{ matrix.api-level }}
          path: stiksound-android/build/instrumented-tests.log
