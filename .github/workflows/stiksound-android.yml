name: StikSound Android

on:
  push:
    paths:
      - "stiksound-android/**"
      - ".github/workflows/stiksound-android.yml"
  pull_request:
    paths:
      - "stiksound-android/**"
      - ".github/workflows/stiksound-android.yml"
  workflow_dispatch:

concurrency:
  group: stiksound-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stiksound-android

jobs:
  build:
    name: Unit tests, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and app unit tests, screenshots, lint, debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stiksound-debug-apk
          path: stiksound-android/app/build/outputs/apk/debug/*.apk
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stiksound-reports
          path: |
            stiksound-android/app/build/screenshots/
            stiksound-android/app/build/reports/
            stiksound-android/core/build/reports/

  instrumented:
    name: Codec tests on emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run MediaCodec, MediaMuxer and WebP tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: stiksound-android
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stiksound-android-test-report-api${{ matrix.api-level }}
          path: stiksound-android/app/build/reports/androidTests/
